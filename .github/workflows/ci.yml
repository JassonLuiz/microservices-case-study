name: CI
on:
  pull_request:
  push:
    branches: [develop, homolog, main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build e testes
        run: mvn -B clean verify
